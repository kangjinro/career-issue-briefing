<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>진로 이슈 브리핑</title>
<meta name="description" content="고등학생을 위한 매일 아침 진로·사회 이슈 브리핑">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1f2430;--muted:#5d6475;--line:#e3e6ef;--accent:#2f5bea;--accent-soft:#eaf0ff;
--hist:#8a4b0f;--hist-soft:#fff4e6;--hist-line:#f3d9b8;--pro:#0f7b54;--pro-soft:#e8f7f0;--pro-line:#bfe6d4;--con:#b4233c;--con-soft:#fdecef;--con-line:#f3c5cf;
--yt:#c4302b;--yt-soft:#fdeeee;--chip:#f0f2f7;--sun:#c4302b;--sat:#2f5bea;--green:#00704A;--green-soft:#d4e9e2;--green-ink:#00573a}
@media (prefers-color-scheme:dark){:root{--bg:#14161c;--card:#1d2028;--ink:#e8eaf0;--muted:#a0a6b5;--line:#2e3340;--accent:#7b9bff;--accent-soft:#25304d;
--hist:#f0b46a;--hist-soft:#2b2218;--hist-line:#4a3a26;--pro:#5fd3a5;--pro-soft:#16302a;--pro-line:#24493f;--con:#ff8b9e;--con-soft:#3a1d24;--con-line:#5a2c36;
--yt:#ff7b74;--yt-soft:#3a1f1e;--chip:#262a34;--sun:#ff7b74;--sat:#7b9bff;--green:#00704A;--green-soft:#1e3d33;--green-ink:#9fd8c2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;line-height:1.65;font-size:16px}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 48px}
.banner{background:var(--green);color:#fff;padding:22px 16px 18px}
.banner .in{max-width:900px;margin:0 auto}
.banner h1{font-size:1.55rem;margin:0;letter-spacing:-.01em}
.banner .by{margin:4px 0 0;font-size:.92rem;font-weight:600;opacity:.95}
.banner .upd{margin:6px 0 0;font-size:.82rem;opacity:.8}
.cal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px 8px;margin:0 0 22px;max-width:340px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.cal-head b{font-size:.95rem}
.cal-head button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;width:28px;height:28px;font-size:.95rem;cursor:pointer;padding:0}
.cal-head button:disabled{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.dow{font-size:.72rem;color:var(--muted);padding:2px 0}
.dow.sun{color:var(--sun)}.dow.sat{color:var(--sat)}
.day{border:none;background:transparent;color:var(--ink);font:inherit;font-size:.82rem;border-radius:8px;height:30px;padding:0;cursor:default}
.day.empty{visibility:hidden}
.day.has{cursor:pointer;font-weight:700;background:var(--green-soft);color:var(--green-ink)}
.day.has:hover{filter:brightness(.95)}
.day.no{color:var(--muted);opacity:.45}
.day.sel{background:var(--green);color:#fff}
.day.today{outline:2px solid var(--green);outline-offset:-2px}
.legend{font-size:.72rem;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--green-soft)}
h2.dtitle{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:.88rem;margin:0 0 16px}
details.hist{background:var(--hist-soft);border:1px solid var(--hist-line);border-radius:14px;margin-bottom:22px}
details.hist summary{display:block;padding:14px 18px;position:relative;padding-right:44px}
details.hist summary .chev{position:absolute;right:16px;top:18px}
.hist .hb{padding:0 18px 14px}
.hist .lab{display:inline-block;font-size:.78rem;font-weight:700;color:#fff;background:var(--hist);border-radius:999px;padding:2px 10px;margin-bottom:6px}
.hist h3{font-size:1.1rem;margin:2px 0 0;color:var(--hist)}
.hist p{margin:0 0 8px}.hist .q{font-weight:600}
h3.sec{font-size:1.05rem;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h3.sec .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
h3.sec.yt .dot{background:var(--yt)}
h3.sec small{font-weight:400;color:var(--muted);font-size:.82rem}
.note{font-size:.85rem;color:var(--muted);margin:-4px 0 10px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;overflow:hidden}
details[open]{box-shadow:0 2px 10px rgba(30,40,80,.08)}
summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
summary::-webkit-details-marker{display:none}
.num{flex:0 0 28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.9rem}
details.yt .num{background:var(--yt-soft);color:var(--yt)}
.tt{flex:1;font-weight:600}
.tt small{display:block;font-weight:400;color:var(--muted);font-size:.8rem;margin-top:2px}
.chev{flex:0 0 auto;color:var(--muted);transition:transform .2s;margin-top:3px}
details[open] .chev{transform:rotate(180deg)}
.body{padding:0 16px 16px 56px}
.blk{margin:10px 0}
.blk b{display:block;font-size:.85rem;color:var(--accent);margin-bottom:2px}
details.yt .blk b{color:var(--yt)}
.blk ul{margin:2px 0 0;padding-left:18px}
.debate{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.debate div{border-radius:10px;padding:8px 10px;font-size:.93rem}
.debate .p{background:var(--pro-soft);border:1px solid var(--pro-line)}
.debate .c{background:var(--con-soft);border:1px solid var(--con-line)}
.debate i{display:block;font-style:normal;font-weight:700;font-size:.78rem;margin-bottom:2px}
.debate .p i{color:var(--pro)}.debate .c i{color:var(--con)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:.8rem;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
a.src{display:inline-block;margin-top:8px;font-size:.88rem;color:var(--accent);text-decoration:none;font-weight:600}
details.yt a.src{color:var(--yt)}
a.src:hover{text-decoration:underline}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:14px 16px;color:var(--muted);font-size:.92rem}
.foot{margin-top:28px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.loading{color:var(--muted);padding:20px 0}
@media (max-width:560px){.body{padding:0 14px 14px}.debate{grid-template-columns:1fr}.banner h1{font-size:1.3rem}.day{padding:6px 0 12px;font-size:.88rem}}
</style>
</head>
<body>
<header class="banner">
  <div class="in">
    <h1>진로 이슈 브리핑</h1>
    <p class="by">배포: 상일고 진로쌤</p>
    <p class="upd">매일 오전 7시 업데이트됩니다 · 날짜를 눌러 지난 브리핑을 볼 수 있어요</p>
  </div>
</header>
<div class="wrap">
  <section class="cal" aria-label="브리핑 달력">
    <div class="cal-head">
      <button id="prev" aria-label="이전 달">‹</button>
      <b id="ym"></b>
      <button id="next" aria-label="다음 달">›</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend"><i></i>색이 칠해진 날짜에 브리핑이 있습니다.</div>
  </section>
  <main id="brief"><p class="loading">불러오는 중…</p></main>
</div>
<script>
(function(){
  const YT={syuka:"슈카월드",jisik:"지식인사이드",motiv:"동기부여학과",sebasi:"세바시 강연",chungco:"충코의 철학"};
  const DOW=["일","월","화","수","목","금","토"];
  const bust="?v="+Date.now();
  let dates=[], view=null, sel=null;
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const pad=n=>String(n).padStart(2,"0");
  const key=(y,m,d)=>y+"-"+pad(m)+"-"+pad(d);
  const chev='<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  const chips=a=>'<div class="chips">'+(a||[]).map(s=>'<span class="chip">'+esc(s)+'</span>').join("")+'</div>';
  function debate(t){const i=t.indexOf(" vs ");const a=i<0?t:t.slice(0,i),b=i<0?"":t.slice(i+4);
    return '<div class="debate"><div class="p"><i>찬성 측</i>'+esc(a)+'</div><div class="c"><i>반대 측</i>'+esc(b)+'</div></div>';}
  function item(n,it,yt){const qs=Array.isArray(it.q)?it.q:[it.q];
    const meta=yt?(YT[it.ch]||it.ch)+" · 유튜브":it.src;
    return '<details'+(yt?' class="yt"':'')+'><summary><span class="num">'+n+'</span><span class="tt">'+esc(it.t)+'<small>'+esc(meta)+'</small></span>'+chev+'</summary><div class="body">'+
      '<div class="blk"><b>내용 요약</b>'+esc(it.sum)+'</div>'+
      '<div class="blk"><b>탐구 이슈</b><ul>'+qs.map(q=>'<li>'+esc(q)+'</li>').join("")+'</ul></div>'+
      '<div class="blk"><b>쟁점 이슈 (토론해 보기)</b>'+debate(it.d||"")+'</div>'+
      '<div class="blk"><b>관련 고등학교 과목</b>'+chips(it.sub)+'</div>'+
      '<a class="src" href="'+esc(it.url)+'" target="_blank" rel="noopener">'+(yt?"▶ 영상 보러 가기":"📰 기사 원문 보기")+' ↗</a></div></details>';}
  function rangeText(d){const r=d.range||""; if(!r) return ""; return r.indexOf("하루")>=0?r:"전일 오전 7시부터 24시간 기준";}
  function render(d){
    const [y,m,dd]=d.date.split("-").map(Number); const a=d.anniv||{};
    let h='<h2 class="dtitle">'+m+'월 '+dd+'일 ('+esc(d.dow)+') 시사 이슈 브리핑</h2>'+
      '<p class="sub">'+(rangeText(d)?esc(rangeText(d))+' · ':'')+'제목을 누르면 요약 · 탐구 이슈 · 쟁점 · 관련 과목이 펼쳐집니다.</p>'+
      '<details class="hist"><summary><span class="lab">오늘의 역사</span><h3>'+esc(a.title)+'</h3>'+chev+'</summary><div class="hb"><p>'+esc(a.body)+'</p><p class="q">💭 생각해 보기: '+esc(a.q)+'</p>'+chips(a.sub)+'</div></details>'+
      '<h3 class="sec"><span class="dot"></span>오늘의 시사 이슈 '+(d.news||[]).length+' <small>· 빅카인즈 선정</small></h3>';
    if(d.bk_note) h+='<p class="note">'+esc(d.bk_note)+'</p>';
    h+=(d.news||[]).map((it,i)=>item(i+1,it,false)).join("");
    h+='<h3 class="sec yt"><span class="dot"></span>새로 올라온 추천 영상</h3>';
    h+=(d.yt&&d.yt.length)?d.yt.map((it,i)=>item(i+1,it,true)).join(""):'<div class="empty">오늘 새로 올라온 추천 영상은 없습니다.</div>';
    h+='<p class="foot">뉴스 출처: 한국언론진흥재단 빅카인즈(오늘의 이슈·뉴스검색) 및 각 언론사 원문 · 영상 요약은 각 채널의 영상 소개글과 목차를 바탕으로 정리했습니다. 투자 관련 영상은 금융 개념 이해용이며 투자 권유가 아닙니다.</p>';
    $("brief").innerHTML=h;
  }
  async function open(k,push){
    sel=k; drawCal();
    $("brief").innerHTML='<p class="loading">불러오는 중…</p>';
    try{const r=await fetch("data/"+k+".json"+bust); if(!r.ok) throw 0; render(await r.json());}
    catch(e){$("brief").innerHTML='<div class="empty">이 날짜의 브리핑을 불러오지 못했습니다.</div>';}
    if(push!==false) history.replaceState(null,"","#"+k);
  }
  function drawCal(){
    const [y,m]=view; $("ym").textContent=y+"년 "+m+"월";
    const first=new Date(y,m-1,1).getDay(), last=new Date(y,m,0).getDate();
    const t=new Date(), tk=key(t.getFullYear(),t.getMonth()+1,t.getDate());
    let h=DOW.map((w,i)=>'<div class="dow'+(i==0?' sun':i==6?' sat':'')+'">'+w+'</div>').join("");
    for(let i=0;i<first;i++) h+='<span class="day empty"></span>';
    for(let d=1;d<=last;d++){const k=key(y,m,d),has=dates.includes(k);
      h+='<button class="day '+(has?'has':'no')+(k==sel?' sel':'')+(k==tk?' today':'')+'" '+(has?'data-k="'+k+'"':'disabled')+' aria-label="'+m+'월 '+d+'일'+(has?' 브리핑 보기':'')+'">'+d+'</button>';}
    $("grid").innerHTML=h;
    const months=[...new Set(dates.map(s=>s.slice(0,7)))].sort(), cur=y+"-"+pad(m);
    $("prev").disabled=!(months.length&&months[0]<cur); $("next").disabled=!(months.length&&months[months.length-1]>cur);
  }
  $("grid").addEventListener("click",e=>{const b=e.target.closest("button[data-k]"); if(b) open(b.dataset.k);});
  $("prev").onclick=()=>{let [y,m]=view; m--; if(m<1){m=12;y--;} view=[y,m]; drawCal();};
  $("next").onclick=()=>{let [y,m]=view; m++; if(m>12){m=1;y++;} view=[y,m]; drawCal();};
  fetch("data/index.json"+bust).then(r=>r.json()).then(j=>{
    dates=(j.dates||[]).sort();
    const h=location.hash.slice(1), k=dates.includes(h)?h:dates[dates.length-1];
    if(!k){$("brief").innerHTML='<div class="empty">아직 브리핑이 없습니다.</div>'; const t=new Date(); view=[t.getFullYear(),t.getMonth()+1]; drawCal(); return;}
    view=k.split("-").slice(0,2).map(Number); open(k,false);
  }).catch(()=>{$("brief").innerHTML='<div class="empty">브리핑 목록을 불러오지 못했습니다.</div>';});
})();
</script>
</body>
</html>
